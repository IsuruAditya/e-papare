services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: epapere
      POSTGRES_PASSWORD: epapere_dev
      POSTGRES_DB: epapere_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U epapere -d epapere_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
