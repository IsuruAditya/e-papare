# =============================================================================
# EXTERNAL SETUP PREREQUISITES (complete before Story 1.1)
# =============================================================================
# prereq-1: Neon PostgreSQL — create three branch environments:
#   dev    (Neon Free or Starter — local dev + CI)
#   staging (Neon Pro — pre-production verification)
#   production (Neon Pro — live; PITR enabled; Singapore region)
#   Set DATABASE_URL (pooler) and DIRECT_DATABASE_URL (direct) per environment.
#   Never run prisma migrate deploy through the pooler URL.
#   Never run destructive prisma commands (migrate reset, db push) on staging or production.
#
# prereq-2: Upstash Redis — create one database per environment (dev/staging/production).
#   Set REDIS_URL per environment. Required for rate-limit store (AD-14/34).
#   In-memory rate-limit stores are forbidden in any deployed environment.
#
# prereq-3: Cloudflare R2 — create private bucket; configure CORS policy.
#   Set R2_BUCKET, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
#   Presigned PUT/GET flow only — file data must never transit Vercel function body.
#
# prereq-4: Vercel Pro — two Vercel projects from same Git repo (frontend + backend).
#   Set nodejs24.x runtime. Configure env vars per environment.
#   Hobby plan is for non-commercial use only (AD-37).
#
# prereq-5: GitHub repository + Actions — CI workflow requires PostgreSQL service container.
#   Node 24 LTS pinned in .nvmrc and workflow matrix.
#
# prereq-6: Cookie SameSite policy — confirm production domain arrangement before launch.
#   If frontend and backend share a domain/subdomain: use SameSite=Strict or Lax.
#   Default COOKIE_SAME_SITE=None only if cross-origin is confirmed unavoidable.
#   Secure + HttpOnly are always required regardless.
#
# =============================================================================
# LEGAL / COMPLIANCE GATE (Story 9.6 — hard production block)
# =============================================================================
# legal-gate: Sri Lankan legal advisor sign-off required on all five items:
#   LEGAL-01: Child data protection compliance
#   LEGAL-02: Guardian contact consent policy
#   LEGAL-03: Content-retention obligations
#   LEGAL-04: Data processing agreements
#   LEGAL-05: Privacy notice and terms of service
#   Evidence file: docs/compliance/legal-clearance.md
#   No production launch until legal-clearance.md is signed and committed.
# =============================================================================
