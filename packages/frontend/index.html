<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>e-Paperé</title>
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/noto-sans-sinhala-sinhala-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      /*
       * Pre-paint theme guard (FOUC prevention). Runs before React mounts and
       * before first paint, applying the same precedence as
       * `app/theme/theme-storage.ts`: stored `epapere_theme` -> system
       * `prefers-color-scheme` -> light. ThemeContext takes over after mount.
       */
      (function () {
        try {
          var stored = localStorage.getItem('epapere_theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* storage unavailable: fall through to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
