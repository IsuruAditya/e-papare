packages:
  - 'packages/*'

# pnpm v11: allowBuilds replaces onlyBuiltDependencies / neverBuiltDependencies.
# These packages require postinstall scripts for native compilation or code generation.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  lightningcss: true
  prisma: true
  '@tailwindcss/oxide': true
  '@swc/core': true
  # Scarf is download-analytics telemetry (its postinstall phones home); we do
  # not run it. Recorded as a denied build so a clean --frozen-lockfile install
  # does not fail with ERR_PNPM_IGNORED_BUILDS on an undecided build script.
  '@scarf/scarf': false
